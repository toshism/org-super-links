name: Tests

on:
  push:
    branches: [ '*' ]  # Run on any pushed branch
  pull_request:
    branches: [ develop, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 27.1
          - 28.2
          - 29.1
          - snapshot

    steps:
    - uses: actions/checkout@v3

    - name: Set up Emacs
      uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - name: Check syntax
      run: |
        emacs -Q --batch \
          --eval "(add-to-list 'load-path \"$GITHUB_WORKSPACE\")" \
          --eval "(find-file \"$GITHUB_WORKSPACE/org-super-links.el\")" \
          --eval "(condition-case err (check-parens) (error (message \"Syntax error: %S\" err) (kill-emacs 1)))"

    - name: Run tests
      run: |
        emacs -Q --batch \
          --eval "(add-to-list 'load-path \"$GITHUB_WORKSPACE\")" \
          --eval "(require 'org)" \
          --eval "(require 'ert)" \
          --eval "(require 'org-super-links)" \
          --eval "(require 'org-super-links-tests)" \
          --eval "(ert-run-tests-batch-and-exit)"